name: Build Dedicated UniverSee Apps

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build UniverSee Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Universee-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universee-Android
          path: Universee-Android.apk

      - name: Deploy APK to Universal Move VPS
        uses: appleboy/scp-action@master
        continue-on-error: true
        with:
          host: 212.108.107.196
          port: 22543
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Universee-Android.apk"
          target: "/www/wwwroot/universalmove.tech/public/download/"

  build-windows:
    name: Build UniverSee Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Universee-Windows.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universee-Windows
          path: Universee-Windows.zip

  create-release:
    name: Create UniverSee Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Universee-Android
          path: release-assets
        continue-on-error: true

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Universee-Windows
          path: release-assets
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-dedicated
          name: "UniverSee QuickSupport v2.0.0 (Dedicated WebRTC)"
          body: |
            ## UniverSee QuickSupport v2.0.0
            100% Dedicated White-Label Remote Support for Universal Move.
            - Direct P2P WebRTC streaming
            - Integrated directly with Univers'All Collab
            - Zero third-party dependencies
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
